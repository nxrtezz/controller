{% if events %}<table><thead><tr><th>When</th><th>Rule</th><th>Event</th><th>Detail</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.created_at|date:"d M Y H:i" }}</td><td>{% if event.rule %}{{ event.rule.name }}{% else %}—{% endif %}</td><td><span class="severity {{ event.severity }}">{{ event.title }}</span></td><td>{{ event.detail }}</td></tr>{% endfor %}</tbody></table>{% else %}<p class="muted">Nothing has triggered this rule yet.</p>{% endif %}
